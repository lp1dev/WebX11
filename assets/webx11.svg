<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WebX11">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- app badge -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="3"/>

  <!-- browser window -->
  <g filter="url(#soft)">
    <rect x="96" y="120" width="320" height="272" rx="30" fill="#0f172a"/>
    <!-- title bar -->
    <path d="M96 150 a30 30 0 0 1 30 -30 h260 a30 30 0 0 1 30 30 v30 h-320 z" fill="#1e293b"/>
    <circle cx="132" cy="165" r="9" fill="#f87171"/>
    <circle cx="162" cy="165" r="9" fill="#fbbf24"/>
    <circle cx="192" cy="165" r="9" fill="#34d399"/>
    <!-- address pill -->
    <rect x="224" y="154" width="160" height="22" rx="11" fill="#0f172a"/>
    <rect x="236" y="161" width="86" height="8" rx="4" fill="#475569"/>
  </g>

  <!-- terminal screen inside the browser -->
  <rect x="120" y="196" width="272" height="172" rx="14" fill="#060a14"/>
  <!-- prompt line 1 -->
  <path d="M150 232 l22 16 l-22 16" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="190" y="240" width="150" height="14" rx="7" fill="#334155"/>
  <!-- prompt line 2 (active) -->
  <path d="M150 292 l22 16 l-22 16" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="190" y="300" width="26" height="26" rx="5" fill="url(#accent)"/>
</svg>
